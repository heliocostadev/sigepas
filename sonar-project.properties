# Configuração do SonarCloud. Só é usada quando o job "sonarcloud" do CI estiver ligado (variável SONAR_HABILITADO).
# A chave do projeto e a organização são criadas ao importar o repositório no SonarCloud; conferir os dois valores
# abaixo com o que o SonarCloud mostrar e corrigir se forem diferentes.
sonar.projectKey=heliocostadev_sigepas
sonar.organization=heliocostadev
sonar.projectName=SIGEPAS

sonar.sources=src,backend/src,frontend/src
sonar.tests=src,backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,backend/src/teste/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,backend/src/gerado/**,backend/src/teste/**
# Arquivos que só iniciam a aplicação ou preparam os testes. O Vitest também os deixa fora da cobertura.
sonar.coverage.exclusions=backend/src/main.ts,frontend/src/main.tsx,frontend/src/preparar-testes.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
