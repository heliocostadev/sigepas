version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      ferramentas-de-desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  # Imagens base dos Dockerfiles (Node e Nginx).
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Imagens dos Compose de desenvolvimento e de produção (PostgreSQL, Caddy, Prometheus e Grafana).
  - package-ecosystem: docker-compose
    directories: [/, /infraestrutura/producao]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Plugin da AWS do Terraform.
  - package-ecosystem: terraform
    directory: /infraestrutura/terraform
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
