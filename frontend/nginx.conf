# O Nginx serve as telas e repassa as chamadas de /api/ para a API, na rede interna do Docker Compose.
# Ele roda sem permissão de administrador (imagem nginx-unprivileged), por isso escuta a porta 8080.

# Log sem a query string e sem o endereço IP do cliente: nome, telefone ou matrícula na URL não chegam ao log, e o IP,
# que é dado pessoal pela LGPD, só será guardado quando o prazo de guarda estiver definido.
# Os campos upstream mostram se uma falha (502, 504) veio da API, sem gravar dado pessoal.
log_format sigepas_sem_dados_pessoais '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time upstream=$upstream_status $upstream_response_time';

# Protocolo original do cliente. Em produção, o Caddy termina o HTTPS e avisa no X-Forwarded-Proto. Sem o Caddy, como
# na máquina de desenvolvimento, vale o protocolo que chegou a este Nginx.
map $http_x_forwarded_proto $protocolo_do_cliente {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log sigepas_sem_dados_pessoais;
  # O log de erro do Nginx não aceita formato próprio e grava o IP e a query string. Por isso, ele só registra os erros
  # críticos. Os erros comuns (como corpo grande demais) aparecem no log de acesso, pelo código de resposta.
  error_log /var/log/nginx/error.log crit;

  # Em produção, o Caddy fica na frente, com o IP fixo 172.30.0.10 na rede do Compose, e informa o IP real do cliente.
  # Só esse endereço é confiável. Sem o Caddy, como na máquina de desenvolvimento, a regra não tem efeito.
  set_real_ip_from 172.30.0.10;
  real_ip_header X-Forwarded-For;

  # As métricas ficam numa porta interna da API, que este Nginx não repassa. Esta regra é uma segunda barreira, para
  # qualquer variação do endereço (maiúsculas, barra no fim).
  location ~* ^/api/metrics {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    # Só o endereço que chegou a este Nginx. O que o cliente escreveu no cabeçalho é descartado.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $protocolo_do_cliente;
  }

  # Os cabeçalhos de segurança ficam só nas telas. As respostas de /api/ levam os cabeçalhos do helmet, que a própria
  # API envia, inclusive o HSTS. Se ficassem no bloco server, os dois conjuntos se somariam nas respostas da API.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /index.html;
  }
}
